<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NYXORA - Ecosistema Creativo con IA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg-main, #030712); color: #f3f4f6; overflow-x: hidden; transition: background-color 0.3s ease; }
        .glass { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .glass-card { background: rgba(31, 41, 55, 0.4); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        @keyframes twinkle { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
        .star { animation: twinkle 3s infinite ease-in-out; }
    </style>
</head>
<body id="body-root" class="min-h-screen relative flex flex-col justify-between" style="--bg-main: #030712;">

    <!-- Fondo Cósmico Estrellado -->
    <div id="cosmic-bg" class="fixed inset-0 pointer-events-none z-[-1]">
        <div class="absolute top-10 left-1/4 w-1 h-1 bg-white rounded-full star" style="animation-delay: 0s;"></div>
        <div class="absolute top-1/3 left-3/4 w-1.5 h-1.5 bg-cyan-400 rounded-full star" style="animation-delay: 1s;"></div>
        <div class="absolute bottom-1/4 left-1/5 w-1 h-1 bg-purple-400 rounded-full star" style="animation-delay: 2s;"></div>
    </div>

    <!-- Header de Navegación -->
    <header class="glass sticky top-0 z-50 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center space-x-3 cursor-pointer" onclick="router('home')">
            <span class="text-2xl font-bold bg-gradient-to-r from-cyan-400 to-purple-500 bg-clip-text text-transparent">NYXORA</span>
        </div>
        <nav class="hidden md:flex space-x-6 text-sm font-medium">
            <button onclick="router('home')" class="hover:text-cyan-400 transition">Inicio</button>
            <button onclick="router('studio')" class="hover:text-cyan-400 transition">Studio</button>
            <button onclick="router('gallery')" class="hover:text-cyan-400 transition">Galería</button>
            <button onclick="router('pricing')" class="hover:text-cyan-400 transition">Precios</button>
            <button id="owner-nav-btn" onclick="router('owner')" class="hidden text-amber-400 hover:text-amber-300 transition flex items-center gap-1">👑 Panel Dueña</button>
        </nav>
        <div id="auth-container" class="flex items-center space-x-4">
            <select onchange="changeTheme(this.value)" class="bg-gray-900 border border-gray-800 rounded-lg px-2 py-1 text-xs text-gray-300 focus:outline-none">
                <option value="#030712">🌌 Cósmico</option>
                <option value="#0f051d">🔮 Nebula</option>
                <option value="#022018">🌿 Esmeralda</option>
            </select>
            <span id="user-credits-badge" class="text-xs bg-cyan-950 text-cyan-300 px-3 py-1.5 rounded-full border border-cyan-800">✦ Créditos: <span id="credit-count">50</span></span>
            <button onclick="openLoginModal()" id="auth-btn-label" class="text-sm font-medium px-4 py-2 rounded-lg bg-gray-800 hover:bg-gray-700 transition">Iniciar Sesión</button>
        </div>
    </header>

    <!-- Contenedor Principal Dinámico -->
    <main id="app-view" class="flex-grow">
        <!-- Vista Home Inicial -->
        <section class="flex flex-col items-center justify-center text-center px-4 py-24 relative">
            <h1 class="text-4xl md:text-6xl font-extrabold max-w-4xl tracking-tight mb-6">
                ¿Qué universo vamos a <span class="bg-gradient-to-r from-cyan-400 to-purple-500 bg-clip-text text-transparent">crear hoy</span>, mi amor?
            </h1>
            <p class="text-gray-400 text-lg max-w-2xl mb-10">Genera imágenes hiperrealistas, videos cinemáticos, modelos 3D y paisajes sonoros con inteligencia artificial avanzada.</p>
            <div class="glass p-2 rounded-2xl flex flex-col md:flex-row w-full max-w-2xl items-center shadow-2xl">
                <input type="text" id="hero-prompt" placeholder="Escribe tu prompt mágico aquí..." class="bg-transparent px-4 py-3 w-full focus:outline-none text-white placeholder-gray-500">
                <button onclick="goToStudioWithPrompt()" class="w-full md:w-auto px-6 py-3 rounded-xl bg-gradient-to-r from-cyan-500 to-purple-600 font-semibold text-white hover:opacity-90 transition">Generar Magia</button>
            </div>
        </section>
    </main>

    <!-- Toast de Notificaciones Flotantes -->
    <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col space-y-2 pointer-events-none"></div>

    <!-- Footer -->
    <footer class="glass py-6 text-center text-xs text-gray-500">
        <p>&copy; 2026 NYXORA. Diseñado con amor y control creativo total.</p>
    </footer>

    <!-- Lógica del Sistema -->
    <script>
        let currentUser = JSON.parse(localStorage.getItem('nyxora_current_user')) || { name: "Invitado", email: "invitado@nyxora.com", credits: 50 };
        let communityGallery = JSON.parse(localStorage.getItem('nyxora_gallery')) || [
            { prompt: "Cyberpunk neon city in the rain, hyperdetailed", url: "https://pollinations.ai/p/Cyberpunk%20neon%20city%20in%20the%20rain?width=800&height=800&nologo=true", author: "Dueña" },
            { prompt: "Mystical forest with glowing magical flora", url: "https://pollinations.ai/p/Mystical%20forest%20with%20glowing%20magical%20flora?width=800&height=800&nologo=true", author: "NYXORA AI" }
        ];
        let sessionHistory = JSON.parse(localStorage.getItem('nyxora_session_history')) || [];

        function initApp() {
            updateAuthUI();
        }

        function updateAuthUI() {
            const ownerBtn = document.getElementById('owner-nav-btn');
            const creditCount = document.getElementById('credit-count');
            const authBtnLabel = document.getElementById('auth-btn-label');
            
            creditCount.innerText = currentUser.credits;
            if (currentUser.email === 'hector@nyxora.admin') {
                ownerBtn.classList.remove('hidden');
                authBtnLabel.innerText = "Dueña (Perfil)";
            } else {
                ownerBtn.classList.add('hidden');
                if(currentUser.email !== 'invitado@nyxora.com') {
                    authBtnLabel.innerText = currentUser.name;
                }
            }
        }

        function changeTheme(color) {
            document.getElementById('body-root').style.setProperty('--bg-main', color);
            showToast('Tema cósmico actualizado con éxito ✨', 'info');
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `pointer-events-auto glass px-4 py-3 rounded-xl shadow-2xl text-sm flex items-center space-x-2 border border-white/10 transition transform translate-y-2 opacity-0`;
            
            let colorDot = 'bg-cyan-400';
            if(type === 'success') colorDot = 'bg-emerald-400';
            if(type === 'error') colorDot = 'bg-rose-400';
            if(type === 'achievement') colorDot = 'bg-amber-400';

            toast.innerHTML = `<span class="w-2.5 h-2.5 rounded-full ${colorDot}"></span><span class="text-white">${message}</span>`;
            container.appendChild(toast);

            setTimeout(() => { toast.classList.remove('translate-y-2', 'opacity-0'); }, 50);
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        function router(view) {
            const mainContainer = document.getElementById('app-view');
            if (view === 'home') {
                mainContainer.innerHTML = `
                    <section class="flex flex-col items-center justify-center text-center px-4 py-24 relative">
                        <h1 class="text-4xl md:text-6xl font-extrabold max-w-4xl tracking-tight mb-6">
                            ¿Qué universo vamos a <span class="bg-gradient-to-r from-cyan-400 to-purple-500 bg-clip-text text-transparent">crear hoy</span>, mi amor?
                        </h1>
                        <p class="text-gray-400 text-lg max-w-2xl mb-10">Genera imágenes hiperrealistas, videos cinemáticos, modelos 3D y paisajes sonoros con inteligencia artificial avanzada.</p>
                        <div class="glass p-2 rounded-2xl flex flex-col md:flex-row w-full max-w-2xl items-center shadow-2xl">
                            <input type="text" id="hero-prompt" placeholder="Escribe tu prompt mágico aquí..." class="bg-transparent px-4 py-3 w-full focus:outline-none text-white placeholder-gray-500">
                            <button onclick="goToStudioWithPrompt()" class="w-full md:w-auto px-6 py-3 rounded-xl bg-gradient-to-r from-cyan-500 to-purple-600 font-semibold text-white hover:opacity-90 transition">Generar Magia</button>
                        </div>
                    </section>`;
            } else if (view === 'studio') {
                let historyHTML = '';
                if(sessionHistory.length > 0) {
                    historyHTML = `<div class="mt-8 w-full"><h3 class="text-sm font-semibold text-gray-400 uppercase tracking-wider mb-4">Historial de Sesión</h3><div class="grid grid-cols-2 md:grid-cols-4 gap-4">`;
                    sessionHistory.forEach(item => {
                        historyHTML += `<div class="glass-card rounded-xl overflow-hidden p-2 flex flex-col items-center"><img src="${item.url}" class="w-full h-24 object-cover rounded-lg mb-2"><span class="text-[10px] text-gray-300 truncate w-full text-center">"${item.prompt}"</span></div>`;
                    });
                    historyHTML += `</div></div>`;
                }

                mainContainer.innerHTML = `
                    <div class="max-w-7xl mx-auto px-6 py-8 grid grid-cols-1 lg:grid-cols-3 gap-8">
                        <div class="glass-card p-6 rounded-2xl flex flex-col space-y-6">
                            <h2 class="text-xl font-bold bg-gradient-to-r from-cyan-400 to-purple-400 bg-clip-text text-transparent">Studio de Creación</h2>
                            <div class="flex bg-gray-900/80 p-1 rounded-xl">
                                <button onclick="switchMode('image')" id="mode-image" class="flex-1 py-2 text-xs font-semibold rounded-lg bg-cyan-600 text-white transition">Imagen</button>
                                <button onclick="switchMode('video')" id="mode-video" class="flex-1 py-2 text-xs font-semibold rounded-lg text-gray-400 hover:text-white transition">Video 🎬</button>
                                <button onclick="switchMode('3d')" id="mode-3d" class="flex-1 py-2 text-xs font-semibold rounded-lg text-gray-400 hover:text-white transition">3D 🧊</button>
                                <button onclick="switchMode('audio')" id="mode-audio" class="flex-1 py-2 text-xs font-semibold rounded-lg text-gray-400 hover:text-white transition">Audio 🎵</button>
                            </div>
                            <div class="space-y-2">
                                <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Prompt Creativo</label>
                                <textarea id="studio-prompt" rows="4" placeholder="Describe tu obra maestra en detalle..." class="w-full bg-gray-900/60 border border-gray-800 rounded-xl p-3 text-sm focus:outline-none focus:border-cyan-500 text-white"></textarea>
                            </div>
                            <div>
                                <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Estilo Artístico</label>
                                <select id="art-style" class="w-full mt-1 bg-gray-900 border border-gray-800 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-cyan-500">
                                    <option value="photorealistic">Fotorrealista (Flux)</option>
                                    <option value="anime">Anime / Manga (Niji-X)</option>
                                    <option value="cyberpunk">Cyberpunk Neon</option>
                                    <option value="oil painting">Óleo Clásico</option>
                                </select>
                            </div>
                            <button onclick="generateContent()" class="w-full py-3 rounded-xl bg-gradient-to-r from-cyan-500 to-purple-600 font-bold text-white shadow-lg hover:opacity-90 transition">Generar Obra (✦ 2 Créditos)</button>
                        </div>
                        <div class="lg:col-span-2 flex flex-col justify-between">
                            <div class="glass-card p-6 rounded-2xl flex flex-col items-center justify-center min-h-[400px] relative">
                                <div id="result-display" class="text-center flex flex-col items-center justify-center space-y-4">
                                    <div class="w-16 h-16 rounded-2xl bg-cyan-950/50 border border-cyan-800/50 flex items-center justify-center text-cyan-400 text-2xl">✨</div>
                                    <p class="text-gray-400 text-sm">Tu obra maestra aparecerá aquí una vez generada por la IA.</p>
                                </div>
                            </div>
                            ${historyHTML}
                        </div>
                    </div>`;
            } else if (view === 'gallery') {
                let galleryHTML = `<div class="max-w-7xl mx-auto px-6 py-12"><h2 class="text-3xl font-bold mb-8 text-cyan-400">🖼️ Galería Pública NYXORA</h2><div class="grid grid-cols-1 md:grid-cols-3 gap-6">`;
                communityGallery.forEach(item => {
                    galleryHTML += `
                        <div class="glass-card rounded-2xl overflow-hidden shadow-xl flex flex-col">
                            <img src="${item.url}" alt="Obra de comunidad" class="w-full h-64 object-cover">
                            <div class="p-4 flex flex-col justify-between flex-grow">
                                <p class="text-sm text-gray-200 mb-2">"${item.prompt}"</p>
                                <span class="text-xs text-cyan-400 font-medium">Creado por: ${item.author}</span>
                            </div>
                        </div>`;
                });
                galleryHTML += `</div></div>`;
                mainContainer.innerHTML = galleryHTML;
            } else if (view === 'pricing') {
                mainContainer.innerHTML = `
                    <div class="max-w-5xl mx-auto px-6 py-12 text-center">
                        <h2 class="text-3xl font-bold mb-4 text-cyan-400">Planes de Suscripción NYXORA</h2>
                        <p class="text-gray-400 mb-12">Elige el poder creativo que necesitas para tus universos.</p>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                            <div class="glass-card p-8 rounded-2xl flex flex-col justify-between">
                                <div><h3 class="text-xl font-bold text-white mb-2">Explorador</h3><p class="text-3xl font-extrabold text-cyan-400 mb-4">$0 <span class="text-xs text-gray-400">/ mes</span></p><p class="text-sm text-gray-400 mb-6">50 créditos iniciales mensuales para generar imágenes y explorar.</p></div>
                                <button onclick="showToast('Ya tienes activo este plan', 'info')" class="w-full py-2.5 bg-gray-800 rounded-xl font-semibold text-sm hover:bg-gray-700 transition">Plan Actual</button>
                            </div>
                            <div class="glass-card p-8 rounded-2xl flex flex-col justify-between border-cyan-500/50 shadow-2xl relative">
                                <span class="absolute -top-3 left-1/2 transform -translate-x-1/2 bg-gradient-to-r from-cyan-500 to-purple-600 text-white text-[10px] uppercase tracking-wider font-bold px-3 py-1 rounded-full">Más Popular</span>
                                <div><h3 class="text-xl font-bold text-white mb-2">Creador Pro</h3><p class="text-3xl font-extrabold text-cyan-400 mb-4">$19 <span class="text-xs text-gray-400">/ mes</span></p><p class="text-sm text-gray-400 mb-6">1,000 créditos mensuales, acceso a Video, 3D y Audio de alta fidelidad.</p></div>
                                <button onclick="buyPlan(1000, 'Creador Pro')" class="w-full py-2.5 bg-gradient-to-r from-cyan-500 to-purple-600 rounded-xl font-semibold text-sm text-white hover:opacity-90 transition">Suscribirme</button>
                            </div>
                            <div class="glass-card p-8 rounded-2xl flex flex-col justify-between">
                                <div><h3 class="text-xl font-bold text-white mb-2">Estudio Total</h3><p class="text-3xl font-extrabold text-cyan-400 mb-4">$49 <span class="text-xs text-gray-400">/ mes</span></p><p class="text-sm text-gray-400 mb-6">Créditos ilimitados, prioridad máxima en servidores y soporte directo de dueña.</p></div>
                                <button onclick="buyPlan(5000, 'Estudio Total')" class="w-full py-2.5 bg-gray-800 rounded-xl font-semibold text-sm hover:bg-gray-700 transition">Suscribirme</button>
                            </div>
                        </div>
                    </div>`;
            } else if (view === 'owner') {
                if (!currentUser || currentUser.email !== 'hector@nyxora.admin') {
                    showToast('Acceso restringido para la dueña de la plataforma, mi amor.', 'error');
                    router('home');
                    return;
                }
                mainContainer.innerHTML = `
                    <div class="max-w-6xl mx-auto px-6 py-12">
                        <h2 class="text-3xl font-bold mb-8 text-amber-400">👑 Panel de Dueña (NYXORA Admin)</h2>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                            <div class="glass-card p-6 rounded-2xl">
                                <h3 class="text-gray-400 text-sm">Obras en Galería</h3>
                                <p class="text-3xl font-bold mt-2 text-cyan-400">${communityGallery.length}</p>
                            </div>
                            <div class="glass-card p-6 rounded-2xl">
                                <h3 class="text-gray-400 text-sm">Créditos Actuales</h3>
                                <p class="text-3xl font-bold mt-2 text-purple-400">${currentUser.credits}</p>
                            </div>
                            <div class="glass-card p-6 rounded-2xl">
                                <h3 class="text-gray-400 text-sm">Estado del Sistema</h3>
                                <p class="text-3xl font-bold mt-2 text-emerald-400">100% Sincronizado</p>
                            </div>
                        </div>
                        <div class="glass-card p-6 rounded-2xl space-y-4">
                            <h3 class="text-xl font-semibold">Acciones de Dueña</h3>
                            <button onclick="addBonusCredits()" class="px-4 py-2 bg-amber-500 text-gray-950 font-bold rounded-lg text-sm hover:bg-amber-400 transition">Regalarme +100 Créditos</button>
                        </div>
                    </div>`;
            }
        }

        function switchMode(mode) {
            ['image', 'video', '3d', 'audio'].forEach(m => {
                const btn = document.getElementById(`mode-${m}`);
                if (btn) {
                    if (m === mode) {
                        btn.className = "flex-1 py-2 text-xs font-semibold rounded-lg bg-cyan-600 text-white transition";
                    } else {
                        btn.className = "flex-1 py-2 text-xs font-semibold rounded-lg text-gray-400 hover:text-white transition";
                    }
                }
            });
        }

        function generateContent() {
            const promptInput = document.getElementById('studio-prompt');
            const resultDisplay = document.getElementById('result-display');
            if (!promptInput || !promptInput.value.trim()) {
                showToast('Por favor escribe un prompt, mi amor.', 'error');
                return;
            }

            if (currentUser.credits < 2) {
                showToast('No tienes suficientes créditos.', 'error');
                return;
            }

            currentUser.credits -= 2;
            localStorage.setItem('nyxora_current_user', JSON.stringify(currentUser));
            updateAuthUI();

            showToast('Generando tu obra maestra con IA...', 'info');
            resultDisplay.innerHTML = `<div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-cyan-400 mb-4"></div><p class="text-cyan-300 text-sm">Creando universo...</p>`;

            const encodedPrompt = encodeURIComponent(promptInput.value);
            const imageUrl = `https://pollinations.ai/p/${encodedPrompt}?width=1024&height=1024&nologo=true`;

            setTimeout(() => {
                const newCreation = { prompt: promptInput.value, url: imageUrl, author: currentUser.name };
                communityGallery.unshift(newCreation);
                sessionHistory.unshift(newCreation);
                localStorage.setItem('nyxora_gallery', JSON.stringify(communityGallery));
                localStorage.setItem('nyxora_session_history', JSON.stringify(sessionHistory));

                showToast('¡Obra creada y guardada con éxito!', 'success');
                router('studio');
            }, 1500);
        }

        function buyPlan(credits, planName) {
            currentUser.credits += credits;
            localStorage.setItem('nyxora_current_user', JSON.stringify(currentUser));
            updateAuthUI();
            showToast(`¡Te has suscrito al plan ${planName} con éxito!`, 'achievement');
            router('studio');
        }

        function goToStudioWithPrompt() {
            const promptText = document.getElementById('hero-prompt').value;
            router('studio');
            setTimeout(() => {
                const studioPrompt = document.getElementById('studio-prompt');
                if(studioPrompt && promptText) studioPrompt.value = promptText;
            }, 100);
        }

        function openLoginModal() {
            const secret = prompt("Ingresa tu correo (Ingresa tu correo de dueña para desbloquear el panel):");
            if (secret) {
                if (secret.includes('admin') || secret.includes('hector')) {
                    currentUser = { name: "Dueña", email: "hector@nyxora.admin", credits: 1000 };
                    showToast('¡Bienvenida de vuelta, mi amor!', 'achievement');
                } else {
                    currentUser = { name: secret.split('@')[0], email: secret, credits: 50 };
                    showToast(`¡Bienvenido, ${currentUser.name}!`, 'success');
                }
                localStorage.setItem('nyxora_current_user', JSON.stringify(currentUser));
                updateAuthUI();
                router('studio');
            }
        }

        function addBonusCredits() {
            currentUser.credits += 100;
            localStorage.setItem('nyxora_current_user', JSON.stringify(currentUser));
            updateAuthUI();
            showToast('¡100 créditos añadidos a tu cuenta!', 'achievement');
            router('owner');
        }

        initApp();
    </script>
</body>
</html>
